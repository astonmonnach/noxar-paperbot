name: paper bot

# Actions cannot hold a process open (6h job cap), so the bot runs one cycle per
# tick and carries its state in the repo. 15 minutes is well inside the 72h
# hold, and a few minutes of cron drift does not matter for this strategy.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:          # never let two ticks write state.json at once
  group: paperbot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # the bot is pure standard library - nothing to install

      - name: Run one cycle
        run: python -m trackD.bot --once

      - name: Render dashboard
        run: python -m trackD.dashboard --static docs/index.html

      - name: Commit state
        run: |
          git config user.name  "paper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trackd/state.json data/trackd/fills.jsonl docs/index.html
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "tick $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push
