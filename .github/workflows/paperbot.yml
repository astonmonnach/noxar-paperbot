name: paper bot

# Actions cannot hold a process open (6h job cap), so the bot runs one cycle per
# tick and carries its state in the repo. 15 minutes is well inside the 72h
# hold, and a few minutes of cron drift does not matter for this strategy.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:          # never let two ticks write state.json at once
  group: paperbot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # the bot is pure standard library - nothing to install

      # Both state.json and fills.jsonl are rewritten every tick, so a rebase
      # against a concurrent tick always conflicts. Instead: reset to the
      # remote, run the cycle on that state, push, and on rejection start over
      # from the new head. The bot is deterministic given its input state, so
      # re-running is always safe.
      # GitHub throttles scheduled workflows hard: this repo asked for a tick
      # every 15 minutes and got one every 136 on average, with a 341-minute
      # gap overnight. A position then sat unwatched and exited 27 points below
      # its stop. So each job now POLLS INTERNALLY for ~50 minutes instead of
      # doing one cycle, which makes coverage depend on job runtime rather than
      # on cron punctuality. The concurrency group keeps at most one running
      # plus one queued, so a queued job takes over as this one finishes.
      # Observed: the */15 cron actually fires about every 6 HOURS on this repo.
      # Internal polling only covers the time a job is alive, so a 50-minute job
      # left 5-hour holes. Each job now runs for ~5.5h (the 6h job cap is the
      # real limit), which closes the gaps without needing a PAT - the built-in
      # GITHUB_TOKEN is not allowed to re-dispatch a workflow.
      - name: Poll for ~5.5 hours
        timeout-minutes: 350
        run: |
          set -e
          git config user.name  "paper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          END=$(( SECONDS + 19500 ))
          while [ $SECONDS -lt $END ]; do
            for attempt in 1 2 3; do
              git fetch -q origin "${{ github.ref_name }}"
              git reset --hard -q "origin/${{ github.ref_name }}"
              python -m trackD.bot --once
              python -m trackD.trending --once || true
              python -m trackD.dashboard --static docs/index.html
              git add data/trackd/state.json data/trackd/fills.jsonl docs/index.html
              git add data/trending/snapshots.jsonl 2>/dev/null || true
              if git diff --staged --quiet; then
                echo "nothing changed"
                break
              fi
              git commit -q -m "tick $(date -u +%Y-%m-%dT%H:%M)"
              if git push -q; then break; fi
              echo "push rejected, retrying from new head"
              sleep 5
            done
            sleep 300
          done
          echo "job window finished"
